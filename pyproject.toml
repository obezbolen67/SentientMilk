[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentientmilk-framework"
version = "0.5.0"
description = "SentientMilk: a local brain server that apps such as MilkChan think with"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "requests>=2.32",
    "textual>=8",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "ruff>=0.6", "mcp>=2.3"]

[project.scripts]
sentientmilk = "sentientmilk_framework.cli:main"

[tool.setuptools.packages.find]
include = ["sentientmilk_framework*"]

[tool.setuptools.package-data]
sentientmilk_framework = ["eval_tasks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["ffmpeg"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
