[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentientmilk-framework"
version = "0.14.0"
description = "SentientMilk: a local brain server that apps such as MilkChan think with"
authors = [{name = "MilkChan Team"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "pystray>=0.19; sys_platform == 'win32'",  # the brain's icon in the notification area
    "requests>=2.32",
    "textual>=8",
    "tzlocal>=5.3.1",  # named local zones and Windows tzdata for calendar/DST scheduling
    "websockets>=13",  # her browser's DevTools protocol (browser.py)
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "ruff>=0.6", "mcp>=2.3"]

[project.scripts]
sentientmilk = "sentientmilk_framework.cli:main"

[tool.setuptools.packages.find]
include = ["sentientmilk_framework*"]

[tool.setuptools.package-data]
sentientmilk_framework = ["eval_tasks/*.json", "assets/*.ico", "assets/skills/*/*", "plugins/*/plugin.json",
                          "browser_page.js", "extension/*", "extension/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["ffmpeg"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
